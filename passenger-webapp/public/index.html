  <!-- Global PWA Capture & Service Worker Init -->
  <script>
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      console.log('PWA: beforeinstallprompt event captured successfully in head');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js')
          .then(function(reg) {
            console.log('PWA: ServiceWorker registered, scope:', reg.scope);
          })
          .catch(function(err) {
            console.error('PWA: ServiceWorker registration error:', err);
          });
      });
    }
  </script>
