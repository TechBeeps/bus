version: '3.8'
services:
  bus-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env

  passenger-webapp:
    build:
      context: .
      dockerfile: passenger-webapp/Dockerfile
    container_name: passenger-webapp
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - bus-backend

  admin-dashboard:
    build:
      context: .
      dockerfile: admin-dashboard/Dockerfile
    container_name: admin-dashboard
    restart: unless-stopped
    ports:
      - "3005:80"
    depends_on:
      - bus-backend
