version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: bus_ticketing_db
    environment:
      POSTGRES_DB: bus_ticketing
      POSTGRES_USER: agency_dev
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    container_name: bus_ticketing_redis
    ports:
      - "6379:6379"

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bus_backend_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://agency_dev:dev_password_123@postgres-db:5432/bus_ticketing
      REDIS_URL: redis://redis-cache:6379/0
      RAZORPAY_WEBHOOK_SECRET: rzp_sec_live_sample
      CASHFREE_WEBHOOK_SECRET: cf_sec_live_sample
    depends_on:
      - postgres-db
      - redis-cache

volumes:
  pgdata:

