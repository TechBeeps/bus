name: Conductor Mobile CI

on:
  push:
    paths:
      - 'conductor-mobile/**'
  pull_request:
    paths:
      - 'conductor-mobile/**'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: |
          cd conductor-mobile
          npm ci --legacy-peer-deps
      - name: Validate Android native project
        run: |
          cd conductor-mobile
          if [ ! -d android/app ] || [ ! -f android/app/build.gradle ]; then
            echo "Android native project files are missing under conductor-mobile/android"
            exit 1
          fi
      - name: Build
        run: |
          cd conductor-mobile
          echo "Android native project validated. Add actual React Native build steps here."
